[package]
name = "chartml-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints]
workspace = true

[dependencies]
chartml-core = { path = "../crates/chartml-core" }
chartml-chart-cartesian = { path = "../crates/chartml-chart-cartesian" }
chartml-chart-pie = { path = "../crates/chartml-chart-pie" }
chartml-chart-scatter = { path = "../crates/chartml-chart-scatter" }
chartml-chart-metric = { path = "../crates/chartml-chart-metric" }
chartml-leptos = { path = "../crates/chartml-leptos" }
chartml-datafusion = { path = "../crates/chartml-datafusion" }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
serde_yaml = "0.9"
wasm-bindgen-futures = "0.4"
# `ChartMLRef` is `Rc<ChartML>` on WASM (the resolver is inherently `?Send`
# on single-threaded targets), so capturing it in a leptos reactive closure
# requires SendWrapper to satisfy leptos's `Send` bound. Safe because
# wasm32-unknown-unknown is single-threaded — the wrapper would panic if
# touched off-thread, which cannot happen on this target.
send_wrapper = "0.6"
# Phase 4 provider example deps: `async_trait` for the mock
# `DataSourceProvider` impl, `serde_json` for inline rows, `wasm-bindgen` +
# `js-sys` for the `Promise`-backed sleep that simulates network latency,
# and `web-sys` for the periodic readout's DOM polling.
async-trait = "0.1"
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
