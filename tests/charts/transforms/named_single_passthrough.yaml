name: "Named source — single source passthrough (no transform)"
tags: [transforms, named-source, single-source, passthrough, bar]
description: >
  A single named source `revenue` with inline rows and NO transform block.
  Verifies that `data: { revenue: { rows: [...] } }` (the chartml 5.0
  named-source map shape) renders identically to the flat inline form
  when no transform is declared. This exercises the resolver's
  single-source NamedMap collapse without invoking DataFusion at all.

chart:
  type: chart
  version: 1
  title: "Weekly Revenue"
  data:
    revenue:
      rows:
        - week: "Week 1"
          revenue: 42000
        - week: "Week 2"
          revenue: 45500
        - week: "Week 3"
          revenue: 43800
        - week: "Week 4"
          revenue: 51200
        - week: "Week 5"
          revenue: 49700
        - week: "Week 6"
          revenue: 55300
  visualize:
    type: bar
    columns: week
    rows: revenue

assertions:
  structure:
    root: svg
    bars: 6
    title_in_svg: false
    legend: false

  bars:
    - label: "Week 1"
      value: 42000
    - label: "Week 2"
      value: 45500
    - label: "Week 3"
      value: 43800
    - label: "Week 4"
      value: 51200
    - label: "Week 5"
      value: 49700
    - label: "Week 6"
      value: 55300

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      labels: ["Week 1", "Week 2", "Week 3", "Week 4", "Week 5", "Week 6"]
    y:
      min: 0
      format: numeric
