      height: 300

assertions:
  structure:
    root: svg
    svg_width: 500
    svg_height: 300
    bars: 30
    title_in_svg: false
    legend: false

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      labels_sampled: true
      orientation: rotated
    y:
      min: 0
      format: numeric
