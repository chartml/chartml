name: "Bar chart — 30 categories on 500px wide chart (extreme density)"
tags: [bar, label-density, many-categories, narrow, stress, single-series]
description: >
  30 department codes rendered on a 500px wide chart. This creates extreme
  label density where the renderer must aggressively thin labels or rotate
  them to avoid total overlap. Tests label handling under severe space
  constraints.

chart:
  type: chart
  version: 1
  title: "Budget by Department"
  data:
    provider: inline
    rows:
      - dept: "Accounting"
        budget: 245000
      - dept: "Admin"
        budget: 128000
