        budget: 415000
      - dept: "Engineering"
        budget: 520000
      - dept: "Facilities"
        budget: 156000
      - dept: "Finance"
        budget: 287000
      - dept: "Growth"
        budget: 234000
      - dept: "HR"
        budget: 178000
      - dept: "InfoSec"
        budget: 365000
      - dept: "IT Support"
        budget: 298000
      - dept: "Legal"
        budget: 267000
      - dept: "Logistics"
        budget: 213000
      - dept: "Marketing"
