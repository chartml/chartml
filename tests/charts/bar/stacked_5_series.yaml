name: "Stacked bar — 5 product lines across 4 quarters"
tags: [bar, stacked, multi-series, many-series, legend]
description: >
  Revenue broken down by 5 SaaS product lines over 4 quarters.
  Tests stacked mode with a higher series count than the existing
  3-series test. Verifies correct segment ordering, legend with
  5 entries, and that all segment heights sum correctly.

