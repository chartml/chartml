name: "Dense bar chart — 24 months of MRR"
tags: [bar, dense, label-rotation, single-series, many-bars]
description: >
  Two full years of monthly recurring revenue as 24 individual bars.
  Tests dense axis label rendering — with this many categories the
  renderer should rotate or skip x-axis labels to avoid overlap.
  Also stress-tests layout with many bars in a standard chart width.

chart:
  type: chart
  version: 1
  title: "Monthly Recurring Revenue — 2024-2025"
  data:
    provider: inline
    rows:
      - month: "Jan 24"
        mrr: 142000
      - month: "Feb 24"
        mrr: 148000
      - month: "Mar 24"
        mrr: 155000
      - month: "Apr 24"
        mrr: 151000
      - month: "May 24"
        mrr: 159000
      - month: "Jun 24"
        mrr: 167000
      - month: "Jul 24"
        mrr: 163000
      - month: "Aug 24"
        mrr: 171000
      - month: "Sep 24"
        mrr: 178000
      - month: "Oct 24"
        mrr: 185000
      - month: "Nov 24"
        mrr: 192000
      - month: "Dec 24"
        mrr: 201000
      - month: "Jan 25"
        mrr: 208000
      - month: "Feb 25"
        mrr: 215000
      - month: "Mar 25"
        mrr: 223000
      - month: "Apr 25"
        mrr: 219000
      - month: "May 25"
        mrr: 228000
      - month: "Jun 25"
        mrr: 237000
      - month: "Jul 25"
        mrr: 234000
      - month: "Aug 25"
        mrr: 243000
