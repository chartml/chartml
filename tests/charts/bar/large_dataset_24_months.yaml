        mrr: 251000
      - month: "Oct 25"
        mrr: 260000
      - month: "Nov 25"
        mrr: 269000
      - month: "Dec 25"
        mrr: 281000
  visualize:
    type: bar
    columns: month
    rows: mrr

assertions:
  structure:
    root: svg
    bars: 24
    title_in_svg: false
    legend: false

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      labels: ["Jan 24", "Feb 24", "Mar 24", "Apr 24", "May 24", "Jun 24", "Jul 24", "Aug 24", "Sep 24", "Oct 24", "Nov 24", "Dec 24", "Jan 25", "Feb 25", "Mar 25", "Apr 25", "May 25", "Jun 25", "Jul 25", "Aug 25", "Sep 25", "Oct 25", "Nov 25", "Dec 25"]
      orientation: horizontal
    y:
