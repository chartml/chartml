name: "Date formatting — reverse chronological order"
tags: [bar, temporal, reverse-order, date-axis, date-formatting, single-series]
description: >
  Monthly data presented in reverse chronological order (December first,
  January last). Tests that the renderer preserves the original data
  order rather than automatically sorting dates chronologically.

chart:
  type: chart
  version: 1
  title: "Monthly Returns (Most Recent First)"
  data:
    provider: inline
    rows:
      - month: "2025-12-01"
        returns: 142
      - month: "2025-11-01"
        returns: 128
      - month: "2025-10-01"
        returns: 135
      - month: "2025-09-01"
        returns: 119
      - month: "2025-08-01"
        returns: 108
      - month: "2025-07-01"
        returns: 95
      - month: "2025-06-01"
        returns: 112
      - month: "2025-05-01"
        returns: 104
      - month: "2025-04-01"
        returns: 98
      - month: "2025-03-01"
        returns: 87
      - month: "2025-02-01"
        returns: 76
      - month: "2025-01-01"
        returns: 82
  visualize:
    type: bar
    columns: month
    rows: returns

assertions:
  structure:
    root: svg
    bars: 12
    title_in_svg: false
    legend: false

  temporal:
    date_reformatted: true

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      label_count: 12
      temporal: true
    y:
      min: 0
      format: numeric
