assertions:
  structure:
    root: svg
    circles: 20
    title_in_svg: false
    legend: true
    legend_entries: 4

  color_encoding:
    field: department
    categories: ["Engineering", "Sales", "Marketing", "Support"]
    distinct_fills: 4

  axes:
    x:
      present: true
      format: numeric
    y:
      present: true
      format: numeric
