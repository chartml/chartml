name: "Scatter with 20 data points across 4 categories"
tags: [scatter, many-points, 4-categories, legend, overlap]
description: >
  Twenty data points across 4 department categories. Tests rendering
  at higher density where points may overlap. The legend should show
  4 entries and all 20 circles should be present in the SVG.

