name: "Date formatting — cross-year boundary daily data"
tags: [line, temporal, cross-year, daily, date-axis, date-formatting, single-series]
description: >
  Daily data spanning November 2024 through February 2025, crossing the
  year boundary. Tests that the renderer handles year transitions in
  labels and correctly formats dates when the year changes mid-axis.

chart:
  type: chart
  version: 1
  title: "Daily Orders — Nov 2024 to Feb 2025"
  data:
    provider: inline
    rows:
      - date: "2024-11-01"
        orders: 340
      - date: "2024-11-08"
        orders: 365
      - date: "2024-11-15"
        orders: 390
      - date: "2024-11-22"
        orders: 420
      - date: "2024-11-29"
        orders: 510
      - date: "2024-12-06"
        orders: 480
      - date: "2024-12-13"
        orders: 520
      - date: "2024-12-20"
        orders: 680
      - date: "2024-12-27"
        orders: 390
      - date: "2025-01-03"
        orders: 310
      - date: "2025-01-10"
        orders: 345
      - date: "2025-01-17"
        orders: 370
      - date: "2025-01-24"
        orders: 385
      - date: "2025-01-31"
        orders: 400
      - date: "2025-02-07"
        orders: 375
      - date: "2025-02-14"
        orders: 450
      - date: "2025-02-21"
        orders: 395
      - date: "2025-02-28"
        orders: 410
  visualize:
    type: line
    columns: date
    rows: orders

assertions:
  structure:
    root: svg
    lines: 1
    title_in_svg: false
    legend: false

  temporal:
    date_reformatted: true

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      temporal: true
      labels_fewer_than: 18
    y:
      min: 0
      format: numeric
