name: "Multi-series line — revenue by 3 regions over 8 weeks"
tags: [line, multi-series, legend, color-encoding]
description: >
  Revenue tracked across North, South, and East regions over 8 weeks.
  A common sales dashboard chart where each region is a separate line
  distinguished by color. Tests marks.color grouping, legend rendering
  with 3 entries, and correct assignment of distinct colors per series.

chart:
  type: chart
  version: 1
  title: "Regional Weekly Revenue"
  data:
    provider: inline
    rows:
      - week: "Wk1"
        region: "North"
        revenue: 38000
      - week: "Wk1"
        region: "South"
        revenue: 29000
      - week: "Wk1"
        region: "East"
        revenue: 22000
      - week: "Wk2"
        region: "North"
        revenue: 41000
      - week: "Wk2"
        region: "South"
        revenue: 31500
      - week: "Wk2"
        region: "East"
        revenue: 24000
      - week: "Wk3"
        region: "North"
        revenue: 39500
      - week: "Wk3"
        region: "South"
        revenue: 33000
      - week: "Wk3"
        region: "East"
        revenue: 25500
      - week: "Wk4"
        region: "North"
        revenue: 44000
      - week: "Wk4"
        region: "South"
        revenue: 32000
      - week: "Wk4"
        region: "East"
        revenue: 27000
      - week: "Wk5"
        region: "North"
        revenue: 46500
      - week: "Wk5"
        region: "South"
        revenue: 35000
      - week: "Wk5"
        region: "East"
        revenue: 28500
      - week: "Wk6"
        region: "North"
        revenue: 43000
      - week: "Wk6"
        region: "South"
        revenue: 36500
      - week: "Wk6"
        region: "East"
        revenue: 30000
      - week: "Wk7"
        region: "North"
        revenue: 48000
      - week: "Wk7"
