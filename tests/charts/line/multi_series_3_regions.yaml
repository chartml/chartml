    type: line
    columns: week
    rows: revenue
    marks:
      color: region

assertions:
  structure:
    root: svg
    lines: 3
    title_in_svg: false
    legend: true
    legend_entries: 3

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      labels: ["Wk1", "Wk2", "Wk3", "Wk4", "Wk5", "Wk6", "Wk7", "Wk8"]
    y:
      min: 0
      format: numeric
