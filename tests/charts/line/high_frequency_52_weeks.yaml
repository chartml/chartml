name: "High frequency — 52 weekly data points"
tags: [line, dense-data, high-frequency, single-series, 52-points]
description: >
  Weekly website sessions over a full year (52 data points). Tests the
  renderer's ability to handle dense x-axis labels without overlap,
  scale correctly across many data points, and maintain smooth line
  rendering with a large number of path segments. The x-axis should
  intelligently thin labels or rotate them to avoid collisions.

