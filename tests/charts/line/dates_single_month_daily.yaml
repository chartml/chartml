name: "Date formatting — all 31 days of a single month"
tags: [line, temporal, daily, single-month, date-axis, date-formatting, single-series]
description: >
  Every day of March 2025 (31 data points) with ISO date strings.
  Tests day-of-month formatting and label density handling when
  all dates share the same month and year — the renderer should
  show concise day-level labels and apply sampling if needed.

