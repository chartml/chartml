name: "Line chart — 10 series with long names (legend stress test)"
tags: [edge-case, line, legend, many-series, wrapping, stress]
description: >
  A line chart with 10 series, each having a long descriptive name
  (25+ characters). Tests that the legend wraps correctly, that 10
  distinct colors are assigned, and that the legend does not overflow
  the chart or overlap the plot area.

