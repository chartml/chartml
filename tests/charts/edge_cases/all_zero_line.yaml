name: "Line chart — every value is exactly zero"
tags: [edge-case, line, zero-domain, flat-line]
description: >
  A line chart where all 6 data points are exactly 0. The y-axis
  domain becomes [0, 0] which is degenerate. The renderer must
  produce a sensible y-axis (e.g. [0, 1] or [0, 0.1]) rather
  than collapsing or dividing by zero. The line should render as
  a flat horizontal stroke at y=0.

chart:
  type: chart
  version: 1
  title: "Defects Found per Sprint"
  data:
    provider: inline
    rows:
      - sprint: "Sprint 1"
        defects: 0
      - sprint: "Sprint 2"
        defects: 0
      - sprint: "Sprint 3"
        defects: 0
      - sprint: "Sprint 4"
        defects: 0
      - sprint: "Sprint 5"
        defects: 0
      - sprint: "Sprint 6"
        defects: 0
  visualize:
    type: line
    columns: sprint
    rows: defects

assertions:
  structure:
    root: svg
    lines: 1
    title_in_svg: false
    legend: false

  scale:
    y_min: 0
    zero_domain_handled: true

  axes:
    x:
      labels: ["Sprint 1", "Sprint 2", "Sprint 3", "Sprint 4", "Sprint 5", "Sprint 6"]
    y:
      min: 0
      format: numeric
      ticks_not_all_zero: true
