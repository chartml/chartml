name: "Date formatting — 24 months spanning two years"
tags: [area, temporal, monthly, two-year, date-axis, date-formatting, label-sampling, single-series]
description: >
  Monthly data for all 24 months of 2024-2025. Tests label sampling
  behavior when there are many monthly date labels — the renderer
  must reduce density to avoid overlap while preserving readability.

