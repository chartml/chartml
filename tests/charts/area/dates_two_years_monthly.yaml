assertions:
  structure:
    root: svg
    areas: 1
    title_in_svg: false
    legend: false

  temporal:
    date_reformatted: true
    label_sampling: true

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      temporal: true
      labels_fewer_than: 24
    y:
      min: 0
      format: numeric
