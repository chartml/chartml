name: "Stacked area — 12 months, 3 series (date label density)"
tags: [area, stacked, label-density, multi-series, legend, twelve-months]
description: >
  12 monthly data points (Jan 2024 through Dec 2024) with 3 stacked
  series representing revenue channels. Tests date label density on
  x-axis with "Mon YYYY" formatted labels. The renderer should space
  labels evenly without overlap.

