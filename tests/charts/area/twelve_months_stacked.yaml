        channel: "Partner Network"
        revenue: 186000
  transform:
    aggregate:
      dimensions: [month, channel]
      measures:
        - column: revenue
          aggregation: sum
          name: total_revenue
  visualize:
    type: area
    mode: stacked
    columns: month
    rows: total_revenue
    marks:
      color: channel

assertions:
  structure:
    root: svg
    areas: 3
    title_in_svg: false
    legend: true
    legend_entries: 3

  stacked:
    series_order: ["Direct Sales", "Online Store", "Partner Network"]
    areas_stacked_on_each_other: true

  scale:
    proportional: true
    y_min: 0
    y_nice: true

  axes:
    x:
      labels:
        - "Jan 2024"
        - "Feb 2024"
        - "Mar 2024"
        - "Apr 2024"
        - "May 2024"
        - "Jun 2024"
        - "Jul 2024"
        - "Aug 2024"
        - "Sep 2024"
        - "Oct 2024"
        - "Nov 2024"
        - "Dec 2024"
      orientation: horizontal
    y:
      min: 0
      format: numeric
