[workspace]
resolver = "2"

members = [
    "crates/chartml-core",
    "crates/chartml-chart-cartesian",
    "crates/chartml-chart-pie",
    "crates/chartml-chart-scatter",
    "crates/chartml-chart-metric",
    "crates/chartml-chart-table",
    "crates/chartml-forecast",
    "crates/chartml-datafusion",
    "crates/chartml-leptos",
    "crates/chartml-render",
    "crates/chartml-test-runner",
    "crates/chartml-wasm",
    "crates/chartml-wasm-datafusion",
    "demo",
]

default-members = [
    "crates/chartml-core",
    "crates/chartml-chart-cartesian",
    "crates/chartml-chart-pie",
    "crates/chartml-chart-scatter",
    "crates/chartml-chart-metric",
    "crates/chartml-chart-table",
    "crates/chartml-forecast",
    "crates/chartml-datafusion",
    "crates/chartml-render",
    "crates/chartml-test-runner",
]

# Workspace-wide lint policy — deny level enforced by pre-commit hook.
# Not using "forbid" because macro-generated code (tokio::test, thiserror, etc.)
# emits #[allow(...)] attributes that conflict with forbid.
[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[workspace.lints.clippy]
too_many_arguments = "deny"
large_enum_variant = "deny"
wrong_self_convention = "deny"

# Optimize WASM release builds for size
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
