[package]
name = "chartml-leptos"
version = "4.0.2"
edition = "2021"
license = "MIT"
description = "Leptos components, hooks, and tooltip context for rendering ChartML charts in reactive Leptos apps"
repository = "https://github.com/chartml/chartml"
homepage = "https://chartml.org"
readme = "README.md"
keywords = ["chartml", "leptos", "chart", "visualization", "svg"]
categories = ["visualization", "gui"]

[dependencies]
chartml-core = { path = "../chartml-core", version = "4.0.0" }
serde_json = "1"
leptos = "0.8"
web-sys = { version = "0.3", features = ["HtmlElement", "DomRect", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
send_wrapper = "0.6"

[lints]
workspace = true
