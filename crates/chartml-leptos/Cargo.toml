[package]
name = "chartml-leptos"
version = "5.1.3"
edition = "2021"
license = "MIT"
description = "Leptos components, hooks, and tooltip context for rendering ChartML charts in reactive Leptos apps"
repository = "https://github.com/chartml/chartml"
homepage = "https://chartml.org"
readme = "README.md"
keywords = ["chartml", "leptos", "chart", "visualization", "svg"]
categories = ["visualization", "gui"]

[dependencies]
chartml-core = { path = "../chartml-core", version = "5" }
serde_json = "1"
leptos = "0.8"
# `Document`, `Event`, and `EventTarget` are needed for the `visibilitychange`
# listener that pauses the auto-refresh interval when the tab is hidden.
# `Element` and `PointerEvent` are needed for the delegated SVG tooltip
# listeners (pointermove / pointerleave on the chart container div).
web-sys = { version = "0.3", features = ["HtmlElement", "DomRect", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverSize", "Document", "Element", "Event", "EventTarget", "MouseEvent", "Node", "PointerEvent", "VisibilityState"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
send_wrapper = "0.6"
# `humantime` parses `cache.ttl` strings ("30s", "5m", "1h") into `Duration`
# for the auto-refresh interval. Already a transitive dep via chartml-core,
# but we surface it here so the parser is unconditional rather than
# accidentally pulled in by feature flags upstream.
humantime = "2"

# `wasm-bindgen-test` exercises `ChartMLChart`'s provider integration in a
# real browser. Native targets compile the test as an empty module via the
# `target_arch = "wasm32"` cfg-gate inside `tests/chart_provider_test.rs`.
# `gloo-timers` provides an awaitable `sleep` that yields back to the
# JS event loop so spawned `wasm_bindgen_futures::spawn_local` tasks have
# a chance to run between assertions. `async-trait` lets the test file
# implement `DataSourceProvider` with the same macro the production
# resolver expects.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
chartml-chart-cartesian = { path = "../chartml-chart-cartesian" }
gloo-timers = { version = "0.3", features = ["futures"] }
async-trait = "0.1"
futures = "0.3"

[lints]
workspace = true
