[package]
name = "chartml-datafusion"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
chartml-core = { path = "../chartml-core" }
chartml-forecast = { path = "../chartml-forecast" }
datafusion = { version = "45", default-features = false }
arrow = { version = "54", default-features = false, features = ["ipc"] }
async-trait = "0.1"
serde_json = "1"
thiserror = "2"

# WASM compatibility patches
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["js"] }
chrono = { version = "0.4", features = ["wasmbind"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
