[package]
name = "chartml-wasm"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "ChartML WASM bindings for npm — chart rendering engine for JavaScript"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chartml-core = { path = "../chartml-core", version = "4.0.0" }
chartml-chart-cartesian = { path = "../chartml-chart-cartesian", version = "4.0.0" }
chartml-chart-pie = { path = "../chartml-chart-pie", version = "4.0.0" }
chartml-chart-scatter = { path = "../chartml-chart-scatter", version = "4.0.0" }
chartml-chart-metric = { path = "../chartml-chart-metric", version = "4.0.0" }
chartml-chart-table = { path = "../chartml-chart-table", version = "4.0.0" }
chartml-render = { path = "../chartml-render", version = "4.0.0", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
async-trait = "0.1"
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "Window"] }
getrandom = { version = "0.2", features = ["js"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Forwards Rust panics (`unreachable` on wasm) to a JS `console.error` with
# the panic message + Rust backtrace. Tiny crate; the binding installs the
# hook the first time `WasmChartML::new` runs so consumers get readable
# errors out of the box.
console_error_panic_hook = "0.1"
# Wasm32-compatible `SystemTime` shim — must match the type chartml-core's
# resolver/cache uses for `CachedEntry::fetched_at`.
web-time = "1"

[features]
default = ["wasm-indexeddb"]
# Enable the IndexedDb tier-2 cache JS wrapper. Forwards to chartml-core's
# `wasm-indexeddb` feature; only meaningful on the wasm32-unknown-unknown
# target.
wasm-indexeddb = ["chartml-core/wasm-indexeddb"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Cannot use workspace lints because wasm_bindgen emits #[allow(dead_code)]
# which conflicts with workspace forbid. The `tracing` macros also emit
# #[allow(unused_imports)] internally, so unused_imports and unused_mut must
# be `deny` (not `forbid`) too. Mirror the workspace policy with `deny` so
# the pre-commit hook still rejects the same warnings; macro-emitted allows
# are tolerated.
[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"

[lints.clippy]
too_many_arguments = "deny"
large_enum_variant = "deny"
wrong_self_convention = "deny"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
