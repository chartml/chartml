[package]
name = "chartml-wasm"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "ChartML WASM bindings for npm — chart rendering engine for JavaScript"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chartml-core = { path = "../chartml-core", version = "3.1.0" }
chartml-chart-cartesian = { path = "../chartml-chart-cartesian", version = "3.1.0" }
chartml-chart-pie = { path = "../chartml-chart-pie", version = "3.1.0" }
chartml-chart-scatter = { path = "../chartml-chart-scatter", version = "3.1.0" }
chartml-chart-metric = { path = "../chartml-chart-metric", version = "3.1.0" }
chartml-render = { path = "../chartml-render", version = "3.1.0", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
async-trait = "0.1"
serde_json = "1"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "Response", "Window"] }
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Cannot use workspace lints because wasm_bindgen emits #[allow(dead_code)]
# which conflicts with workspace forbid. Mirror workspace lints with deny instead.
[lints.rust]
dead_code = "deny"
unused_imports = "forbid"
unused_variables = "deny"
unused_mut = "forbid"

[lints.clippy]
too_many_arguments = "forbid"
large_enum_variant = "forbid"
wrong_self_convention = "forbid"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
