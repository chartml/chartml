[package]
name = "chartml-chart-metric"
version = "5.0.3"
edition = "2021"
license = "MIT"
description = "ChartML metric/KPI card renderer"
repository = "https://github.com/chartml/chartml"
homepage = "https://chartml.org"
readme = "README.md"
keywords = ["chartml", "chart", "metric", "kpi"]
categories = ["visualization"]

[dependencies]
chartml-core = { path = "../chartml-core", version = "5" }

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"

[lints]
workspace = true
