[package]
name = "chartml-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
async-trait = "0.1"
arrow = { version = "57", default-features = false, features = ["ipc"] }

[lints]
workspace = true
