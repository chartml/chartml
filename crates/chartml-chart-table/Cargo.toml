[package]
name = "chartml-chart-table"
version = "5.0.3"
edition = "2021"
license = "MIT"
description = "ChartML tabular data renderer"
repository = "https://github.com/chartml/chartml"
homepage = "https://chartml.org"
keywords = ["chartml", "chart", "table"]
