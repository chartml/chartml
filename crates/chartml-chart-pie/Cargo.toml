[package]
name = "chartml-chart-pie"
version = "5.0.2"
edition = "2021"
license = "MIT"
description = "ChartML pie and doughnut chart renderers"
repository = "https://github.com/chartml/chartml"
homepage = "https://chartml.org"
readme = "README.md"
keywords = ["chartml", "chart", "pie", "doughnut"]
categories = ["visualization"]

[dependencies]
chartml-core = { path = "../chartml-core", version = "5" }

[dev-dependencies]
serde_yaml = "0.9"
serde_json = "1"

[lints]
workspace = true
