[package]
name = "chartml-wasm-datafusion"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "ChartML DataFusion transform plugin — SQL/aggregate/forecast for WASM"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chartml-core = { path = "../chartml-core", version = "4.0.0" }
chartml-datafusion = { path = "../chartml-datafusion", version = "4.0.0" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
indexmap = "2"
getrandom = { version = "0.2", features = ["js"] }

# Cannot use workspace lints because wasm_bindgen emits #[allow(dead_code)]
# which conflicts with workspace forbid. Mirror workspace lints with deny instead.
[lints.rust]
dead_code = "deny"
unused_imports = "forbid"
unused_variables = "deny"
unused_mut = "forbid"

[lints.clippy]
too_many_arguments = "forbid"
large_enum_variant = "forbid"
wrong_self_convention = "forbid"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
