name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  review-signature:
    name: Review Approval Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed .review-approval file
        run: |
          if [ -f .review-approval ]; then
            echo "::error::.review-approval file found in repository. This file must be gitignored and never committed."
            exit 1
          fi
          echo "No .review-approval file in tree."

  lint-policy:
    name: Lint Suppression Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject new lint suppressions
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          RS=$(git diff "$BASE"...HEAD -- '*.rs' | grep '^+' | grep -v '^+++' | grep '#\[allow(' || true)
          TOML=$(git diff "$BASE"...HEAD -- '*/Cargo.toml' 'Cargo.toml' | grep '^+' | grep -v '^+++' | grep '= "allow"' || true)
          if [ -n "$RS" ] || [ -n "$TOML" ]; then
            echo "::error::Lint suppressions detected. Fix the lint instead of suppressing it."
            [ -n "$RS" ] && echo "" && echo "In .rs files:" && echo "$RS"
            [ -n "$TOML" ] && echo "" && echo "In Cargo.toml:" && echo "$TOML"
            exit 1
          fi
          echo "No new lint suppressions."

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude chartml-wasm --exclude chartml-wasm-datafusion -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude chartml-wasm --exclude chartml-wasm-datafusion

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: bash packages/core/build.sh
      - run: bash packages/datafusion/build.sh

  verify-charts:
    name: Chart Signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug golden SVG hash
        run: |
          echo "File info:"
          file test-output/golden/area/basic_cumulative.svg
          echo "sha256:"
          sha256sum test-output/golden/area/basic_cumulative.svg
          echo "Expected from .sig:"
          head -1 test-output/golden/area/basic_cumulative.svg.sig
          echo "File size:"
          wc -c < test-output/golden/area/basic_cumulative.svg
          echo "Git config:"
          git config --get core.autocrlf || echo "not set"
      - name: Verify golden SVG signatures
        run: bash scripts/verify-charts.sh
