name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:

  lint-policy:
    name: Lint Suppression Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test pre-commit hook outcomes
        run: bash scripts/test-pre-commit.sh

      - name: Check markdown code fences are closed
        run: |
          python3 scripts/tests/test_check_md_fences.py
          python3 scripts/check-md-fences.py docs

      - name: Check docs chart-type lists match the schema
        run: |
          python3 scripts/tests/test_check_spec_chart_types.py
          python3 scripts/check-spec-chart-types.py

      - name: Reject new lint suppressions
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          RS=$(git diff "$BASE"...HEAD -- '*.rs' | grep '^+' | grep -v '^+++' | grep '#\[allow(' || true)
          TOML=$(git diff "$BASE"...HEAD -- '*/Cargo.toml' 'Cargo.toml' | grep '^+' | grep -v '^+++' | grep '= "allow"' || true)
          if [ -n "$RS" ] || [ -n "$TOML" ]; then
            echo "::error::Lint suppressions detected. Fix the lint instead of suppressing it."
            [ -n "$RS" ] && echo "" && echo "In .rs files:" && echo "$RS"
            [ -n "$TOML" ] && echo "" && echo "In Cargo.toml:" && echo "$TOML"
            exit 1
          fi
          echo "No new lint suppressions."

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (host targets, including tests)
        run: cargo clippy --workspace --exclude chartml-wasm --exclude chartml-wasm-datafusion --all-targets -- -D warnings
      # Browser tests and in-source `#[cfg(all(test, target_arch = "wasm32"))]`
      # modules only build for wasm32; the host run above never sees them.
      # chartml-wasm and chartml-wasm-datafusion are excluded from the host run
      # entirely because they are wasm-only crates, so this is also the only
      # lane that lints their library code. Lint them here so the same required
      # Clippy check covers library and test targets on both targets.
      #
      # Both steps use `--all-targets` rather than naming test files, so a new
      # wasm-only test target is linted the day it is added instead of silently
      # going unlinted until someone remembers to list it. That is why every
      # integration test in chartml-core carries a target gate: the host-only
      # ones compile to an empty crate on wasm32 rather than breaking the build.
      #
      # The two steps stay separate because `--features` applies per invocation:
      # only the packages on the same command line receive it, and
      # `wasm-indexeddb` is a chartml-core feature. A dedicated step guarantees
      # chartml-core's feature-gated wasm32 code is compiled even if another
      # crate's defaults change; folding it into the step below would make that
      # depend on chartml-wasm's `default` feature happening to unify.
      - name: "Clippy (wasm32 targets: chartml-core)"
        run: cargo clippy -p chartml-core --all-targets --target wasm32-unknown-unknown --features wasm-indexeddb -- -D warnings
      - name: "Clippy (wasm32 targets: chartml-leptos, chartml-wasm, chartml-wasm-datafusion)"
        run: cargo clippy -p chartml-leptos -p chartml-wasm -p chartml-wasm-datafusion --all-targets --target wasm32-unknown-unknown -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude chartml-wasm --exclude chartml-wasm-datafusion

      # Browser tests: the `wasm_bindgen_test` suites below only run in a real
      # browser, so they live in this required job rather than native
      # `cargo test`. Both the runner and the browser/driver are pinned so a
      # run is repeatable.
      - name: Install wasm-bindgen test runner
        run: |
          # `wasm-bindgen-test-runner` must exactly match the wasm-bindgen
          # crate the tests were built against, so derive it from Cargo.lock
          # instead of keeping a second pin that can drift.
          WASM_BINDGEN_VERSION="$(cargo metadata --locked --format-version 1 \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "wasm-bindgen"))')"
          DIR="${RUNNER_TEMP}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}"
          sudo install -m 0755 \
            "${DIR}/wasm-bindgen" \
            "${DIR}/wasm-bindgen-test-runner" \
            "${DIR}/wasm2es6js" \
            /usr/local/bin/
          test "$(wasm-bindgen-test-runner --version | awk '{print $2}')" = "${WASM_BINDGEN_VERSION}"

      - name: Install pinned headless Chrome and chromedriver
        env:
          CHROME_VERSION: '158.0.8127.88'
        run: |
          BASE="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}"
          curl -sSfLO "${BASE}/linux64/chrome-linux64.zip"
          curl -sSfLO "${BASE}/linux64/chromedriver-linux64.zip"
          unzip -q chrome-linux64.zip
          unzip -q chromedriver-linux64.zip
          sudo mv chrome-linux64 /opt/chrome-for-testing
          sudo install -m 0755 chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          chromedriver --version

      - name: Browser tests (wasm-bindgen, headless Chrome)
        env:
          CHROMEDRIVER: /usr/local/bin/chromedriver
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          # The runner caps a whole test binary at 20s by default. The provider
          # suite alone deliberately waits several seconds, so give CI headroom
          # rather than turning a slow runner into a false failure.
          WASM_BINDGEN_TEST_TIMEOUT: '120'
          WASM_BINDGEN_TEST_DRIVER_TIMEOUT: '30'
        run: |
          cat > "${RUNNER_TEMP}/webdriver.json" <<'JSON'
          {
            "goog:chromeOptions": {
              "binary": "/opt/chrome-for-testing/chrome",
              "args": ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
            }
          }
          JSON
          export WASM_BINDGEN_TEST_WEBDRIVER_JSON="${RUNNER_TEMP}/webdriver.json"

          # A wasm-bindgen test binary with no tests prints "no tests to run!"
          # and exits 0, so assert each suite actually ran the expected number
          # of tests. Update the count when a suite gains or loses a test.
          run_suite() {
            local label="$1" expected="$2"
            shift 2
            local log="${RUNNER_TEMP}/browser-${label}.log"
            if ! "$@" > "${log}" 2>&1; then
              cat "${log}"
              echo "::error::browser suite ${label} failed"
              exit 1
            fi
            cat "${log}"
            if ! grep -q "test result: ok. ${expected} passed; 0 failed" "${log}"; then
              echo "::error::browser suite ${label}: expected ${expected} passing tests"
              exit 1
            fi
          }

          run_suite wasm-api 12 cargo test --target wasm32-unknown-unknown -p chartml-wasm --test web
          run_suite table-layout 25 cargo test --target wasm32-unknown-unknown -p chartml-leptos --test table_layout_test
          run_suite chart-provider 7 cargo test --target wasm32-unknown-unknown -p chartml-leptos --test chart_provider_test
          run_suite indexeddb 7 cargo test --target wasm32-unknown-unknown -p chartml-core --features wasm-indexeddb --test indexeddb_test

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: bash packages/core/build.sh
      - run: bash packages/datafusion/build.sh
      - name: Check packed @chartml/core style.css matches source
        run: bash scripts/check-npm-pack.sh
      # The docs render every `chartml` fence at build time with the WASM
      # package built above. A fence that fails shows a "Chart error" box in
      # the page but does not fail the build, so scan the built pages for them.
      - name: Build docs
        run: npm run docs:build
      - name: Check built docs for chart errors
        run: |
          python3 scripts/tests/test_check_docs_chart_errors.py
          python3 scripts/check-docs-chart-errors.py
