name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:

  lint-policy:
    name: Lint Suppression Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test pre-commit hook outcomes
        run: bash scripts/test-pre-commit.sh

      - name: Check markdown code fences are closed
        run: |
          python3 scripts/tests/test_check_md_fences.py
          python3 scripts/check-md-fences.py docs

      - name: Reject new lint suppressions
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          RS=$(git diff "$BASE"...HEAD -- '*.rs' | grep '^+' | grep -v '^+++' | grep '#\[allow(' || true)
          TOML=$(git diff "$BASE"...HEAD -- '*/Cargo.toml' 'Cargo.toml' | grep '^+' | grep -v '^+++' | grep '= "allow"' || true)
          if [ -n "$RS" ] || [ -n "$TOML" ]; then
            echo "::error::Lint suppressions detected. Fix the lint instead of suppressing it."
            [ -n "$RS" ] && echo "" && echo "In .rs files:" && echo "$RS"
            [ -n "$TOML" ] && echo "" && echo "In Cargo.toml:" && echo "$TOML"
            exit 1
          fi
          echo "No new lint suppressions."

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (host targets, including tests)
        run: cargo clippy --workspace --exclude chartml-wasm --exclude chartml-wasm-datafusion --all-targets -- -D warnings
      # Browser tests and in-source `#[cfg(all(test, target_arch = "wasm32"))]`
      # modules only build for wasm32; the host run above never sees them.
      # chartml-wasm and chartml-wasm-datafusion are excluded from the host run
      # entirely because they are wasm-only crates, so this is also the only
      # lane that lints their library code. Lint them here so the same required
      # Clippy check covers library and test targets on both targets.
      #
      # Both steps use `--all-targets` rather than naming test files, so a new
      # wasm-only test target is linted the day it is added instead of silently
      # going unlinted until someone remembers to list it. That is why every
      # integration test in chartml-core carries a target gate: the host-only
      # ones compile to an empty crate on wasm32 rather than breaking the build.
      #
      # The two steps stay separate because `--features` applies per invocation:
      # only the packages on the same command line receive it, and
      # `wasm-indexeddb` is a chartml-core feature. A dedicated step guarantees
      # chartml-core's feature-gated wasm32 code is compiled even if another
      # crate's defaults change; folding it into the step below would make that
      # depend on chartml-wasm's `default` feature happening to unify.
      - name: "Clippy (wasm32 targets: chartml-core)"
        run: cargo clippy -p chartml-core --all-targets --target wasm32-unknown-unknown --features wasm-indexeddb -- -D warnings
      - name: "Clippy (wasm32 targets: chartml-leptos, chartml-wasm, chartml-wasm-datafusion)"
        run: cargo clippy -p chartml-leptos -p chartml-wasm -p chartml-wasm-datafusion --all-targets --target wasm32-unknown-unknown -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude chartml-wasm --exclude chartml-wasm-datafusion

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: bash packages/core/build.sh
      - run: bash packages/datafusion/build.sh
      - name: Check packed @chartml/core style.css matches source
        run: bash scripts/check-npm-pack.sh
