name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (--dry-run flag)'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Get crates.io publish token via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
            echo "DRY RUN MODE"
          fi

          publish_if_new() {
            local crate="$1"
            local version
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")

            if curl -sf "https://crates.io/api/v1/crates/$crate/$version" > /dev/null 2>&1; then
              echo "::notice::$crate@$version already published — skipping"
            else
              echo "Publishing $crate@$version..."
              cargo publish -p "$crate" --no-verify $FLAGS
              echo "Waiting for crates.io index update..."
              sleep 60
            fi
          }

          echo "=== Group 1: core crates ==="
          publish_if_new chartml-core
          publish_if_new chartml-forecast

          echo "=== Group 2: chart renderers ==="
          publish_if_new chartml-chart-cartesian
          publish_if_new chartml-chart-pie
          publish_if_new chartml-chart-scatter
          publish_if_new chartml-chart-metric
          publish_if_new chartml-chart-table

          echo "=== Group 3: higher-level crates ==="
          publish_if_new chartml-datafusion
          publish_if_new chartml-render
